<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Responsibility</title>
    <!-- For Bootstrap CSS styles -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h3>Save Position of Responsibility</h3>
    <hr>

    <form th:object="${responsibility}" th:action="@{/admin/responsibilities/save}" method="POST">
        <!-- Hidden input for id -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="roleTitle" class="form-label">Role Title</label>
            <input type="text" id="roleTitle" th:field="*{roleTitle}" class="form-control" placeholder="e.g. Vice Captain" required>
        </div>

        <div class="mb-3">
            <label for="organization" class="form-label">Organization</label>
            <input type="text" id="organization" th:field="*{organization}" class="form-control" placeholder="e.g. Army Institute of Technology, Pune" required>
        </div>

        <div class="mb-3">
            <label for="period" class="form-label">Period / Dates</label>
            <input type="text" id="period" th:field="*{period}" class="form-control" placeholder="e.g. June 2024 - May 2025">
        </div>

        <div class="mb-3">
            <label for="displayOrder" class="form-label">Display Order</label>
            <input type="number" id="displayOrder" th:field="*{displayOrder}" class="form-control" placeholder="e.g. 1">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Key responsibilities and achievements in this role"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <hr>
    <div class="d-flex">
        <a th:href="@{/admin/responsibilities}" class="me-3">Back to Responsibilities List</a>
        <a th:href="@{/admin}" class="me-3">Back to Admin Home</a>
        <a th:href="@{/}">Back to Portfolio</a>
    </div>
</div>

</body>
</html>
