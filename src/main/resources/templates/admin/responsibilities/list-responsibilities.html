<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Responsibilities Directory</title>
    <!-- For Bootstrap CSS styles -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h3>Positions of Responsibility Directory</h3>
    <hr>

    <!-- Add responsibility button -->
    <a th:href="@{/admin/responsibilities/showFormForAdd}" class="btn btn-primary btn-sm mb-3">
        Add new responsibility
    </a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Order</th>
            <th>Role Title</th>
            <th>Organization</th>
            <th>Period</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="resp : ${responsibilities}">
            <td th:text="${resp.displayOrder}"></td>
            <td th:text="${resp.roleTitle}"></td>
            <td th:text="${resp.organization}"></td>
            <td th:text="${resp.period}"></td>
            <td th:text="${resp.description}"></td>
            <td>
                <a th:href="@{/admin/responsibilities/showFormForUpdate(responsibilityId=${resp.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/admin/responsibilities/delete(responsibilityId=${resp.id})}" class="btn btn-danger btn-sm" onclick="if (!(confirm('Are you sure you want to delete this responsibility?'))) return false">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex">
        <a th:href="@{/admin}" class="me-3">Back to Admin Home</a>
        <a th:href="@{/}">Back to Portfolio</a>
    </div>
</div>

</body>
</html>
