<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Achievement</title>
    <!-- For Bootstrap CSS styles -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h3>Save Achievement</h3>
    <hr>

    <form th:object="${achievement}" th:action="@{/admin/achievements/save}" method="POST">
        <!-- Hidden input for id -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Tech-Akriti 2025" required>
        </div>

        <div class="mb-3">
            <label for="award" class="form-label">Award / Rank</label>
            <input type="text" id="award" th:field="*{award}" class="form-control" placeholder="e.g. 1st Position">
        </div>

        <div class="mb-3">
            <label for="period" class="form-label">Period / Date</label>
            <input type="text" id="period" th:field="*{period}" class="form-control" placeholder="e.g. January 2025">
        </div>

        <div class="mb-3">
            <label for="displayOrder" class="form-label">Display Order</label>
            <input type="number" id="displayOrder" th:field="*{displayOrder}" class="form-control" placeholder="e.g. 1">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Description of the achievement"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <hr>
    <div class="d-flex">
        <a th:href="@{/admin/achievements}" class="me-3">Back to Achievements List</a>
        <a th:href="@{/admin}" class="me-3">Back to Admin Home</a>
        <a th:href="@{/}">Back to Portfolio</a>
    </div>
</div>

</body>
</html>
