<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Achievements Directory</title>
    <!-- For Bootstrap CSS styles -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h3>Achievements Directory</h3>
    <hr>

    <!-- Add achievement button -->
    <a th:href="@{/admin/achievements/showFormForAdd}" class="btn btn-primary btn-sm mb-3">
        Add new achievement
    </a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Order</th>
            <th>Title</th>
            <th>Award / Rank</th>
            <th>Period</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="achievement : ${achievements}">
            <td th:text="${achievement.displayOrder}"></td>
            <td th:text="${achievement.title}"></td>
            <td th:text="${achievement.award}"></td>
            <td th:text="${achievement.period}"></td>
            <td th:text="${achievement.description}"></td>
            <td>
                <a th:href="@{/admin/achievements/showFormForUpdate(achievementId=${achievement.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/admin/achievements/delete(achievementId=${achievement.id})}" class="btn btn-danger btn-sm" onclick="if (!(confirm('Are you sure you want to delete this achievement?'))) return false">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex">
        <a th:href="@{/admin}" class="me-3">Back to Admin Home</a>
        <a th:href="@{/}">Back to Portfolio</a>
    </div>
</div>

</body>
</html>
